name: Verify dataset PR

on:
  pull_request_target:
    # 不监听 edited：改标题/描述时整轮 skipped 会被 GitHub 当成通过，红的 check 会变灰；改了 base 的 PR 在合并前另有拦截。
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: melb-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  literal:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 30
    outputs:
      data_changed: ${{ steps.changes.outputs.data_changed }}
      eligible: ${{ steps.literal.outputs.eligible }}
      trusted: ${{ steps.literal.outputs.trusted }}
    defaults:
      run:
        working-directory: trusted
    steps:
      # 公共仓库匿名下载，不能让 checkout 的默认 token 进入抓网页 job。
      - name: Fetch trusted base and data blobs anonymously
        working-directory: ${{ github.workspace }}
        env:
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init trusted
          git -C trusted remote add origin "https://github.com/$REPOSITORY.git"
          git -C trusted fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" main:refs/remotes/origin/main
          git -C trusted checkout --detach "$BASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare PR data paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { BASE_SHA: base, HEAD_SHA: head, GITHUB_OUTPUT: output } = process.env;
          if (![base, head].every(sha => /^[a-f0-9]{40}$/.test(sha ?? ''))) throw Error('PR base/head SHA 无效');
          // 三点比较取 PR 自身的改动；禁用 rename 合并，两端及删除都算，NUL 分隔保留特殊文件名。
          const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', `${base}...${head}`], { maxBuffer: 16 * 1024 * 1024 });
          if (files.length && files.at(-1) !== 0) throw Error('git diff 文件列表格式不对');
          const changed = files.toString('utf8').split('\0').some(file => file.startsWith('data/') && file.endsWith('.json'));
          fs.appendFileSync(output, `data_changed=${changed}\n`);
          NODE
      - name: No question data changes
        if: steps.changes.outputs.data_changed == 'false'
        run: echo '没有改问答数据' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install trusted dependencies and PDF tools
        if: steps.changes.outputs.data_changed == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3
      - name: Cache Chromium
        if: steps.changes.outputs.data_changed == 'true'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0-sandbox
      - name: Install browser system dependencies
        if: steps.changes.outputs.data_changed == 'true'
        run: npx --no-install playwright install-deps chromium
      - name: Install Chromium
        if: steps.changes.outputs.data_changed == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install chromium
      - name: Format and literal checks without credentials
        if: steps.changes.outputs.data_changed == 'true'
        id: literal
        run: node scripts/pipeline.mjs literal
      - name: Keep literal evidence and report
        if: always() && !cancelled() && steps.changes.outputs.data_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: literal-evidence-${{ github.run_id }}
          overwrite: true
          path: |
            literal.json
            verify-report.md
          if-no-files-found: warn
          retention-days: 30

  semantic:
    needs: literal
    if: always() && !cancelled() && needs.literal.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read  # 读取 bot 评论指向的上一轮缓存 artifact。
    timeout-minutes: 30
    outputs:
      proof_sha: ${{ steps.semantic.outputs.proof_sha }}
    defaults:
      run:
        working-directory: trusted
    steps:
      - name: No question data changes
        if: needs.literal.result == 'success' && needs.literal.outputs.data_changed == 'false'
        working-directory: ${{ github.workspace }}
        run: echo '没有改问答数据' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false')
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false')
        with:
          node-version: '22'
      - name: Fetch immutable PR commit and main history
        if: (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$HEAD_SHA" main:refs/remotes/origin/main
      - uses: actions/download-artifact@v4
        if: (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false')
        with:
          name: literal-evidence-${{ github.run_id }}
          path: incoming
      - name: Keep initial report for manual cases
        if: (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false')
        run: cp ../incoming/verify-report.md ../verify-report.md
      - name: Meaning checks from literal evidence only
        if: needs.literal.outputs.data_changed == 'true' && needs.literal.result == 'success' && needs.literal.outputs.eligible == 'true' && needs.literal.outputs.trusted == 'true'
        id: semantic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pipeline.mjs semantic
      - name: Mark literal failures and human review red
        if: (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false') && (needs.literal.result != 'success' || needs.literal.outputs.eligible != 'true' || needs.literal.outputs.trusted != 'true')
        run: |
          echo '要人看：字面/格式失败或非自动合并范围；未调用 Claude。' >> ../verify-report.md
          exit 1
      - name: Preserve paid verdict cache, including failed checks
        if: always() && !cancelled() && (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false')
        id: cache
        uses: actions/upload-artifact@v4
        with:
          name: semantic-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: trusted/.cache/semantic-cache.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve merge proof
        if: always() && !cancelled() && (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false') && steps.semantic.outputs.proof_sha != ''
        uses: actions/upload-artifact@v4
        with:
          name: semantic-proof-${{ github.run_id }}
          overwrite: true
          path: trusted/.cache/semantic-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Update one PR comment and cache pointer
        if: always() && !cancelled() && (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ARTIFACT_ID: ${{ steps.cache.outputs.artifact-id }}
        run: node scripts/pipeline.mjs finish
      - name: Keep full report
        if: always() && !cancelled() && (needs.literal.result != 'success' || needs.literal.outputs.data_changed != 'false')
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ github.run_id }}
          overwrite: true
          path: verify-report.md
          if-no-files-found: ignore

  merge:
    needs: [literal, semantic]
    if: needs.semantic.result == 'success' && needs.semantic.outputs.proof_sha != '' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: semantic-proof-${{ github.run_id }}
          path: proof
      - name: Wait for repository merge lock without dropping pending PRs
        id: lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: trusted
        run: node scripts/merge-lock.mjs acquire
      - name: Recheck combined latest-main format and merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_SHA: ${{ needs.semantic.outputs.proof_sha }}
          LOCK_SHA: ${{ steps.lock.outputs.sha }}
        working-directory: trusted
        run: node scripts/merge-pr.mjs
      - name: Release only this run's merge lock
        if: always() && steps.lock.outputs.sha != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOCK_SHA: ${{ steps.lock.outputs.sha }}
        working-directory: trusted
        run: node scripts/merge-lock.mjs release
