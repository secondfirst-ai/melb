name: Verify dataset PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# 权限按 job 给：核对 job 会打开 PR 里给的网页，只拿读 repo + 写评论；只有合并 job 能写 repo。
permissions: {}

concurrency:
  group: melb-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    outputs:
      data_only: ${{ steps.prepare.outputs.data_only }}
      trusted: ${{ steps.prepare.outputs.trusted }}
      verified: ${{ steps.verify.outcome }}
    defaults:
      run:
        working-directory: trusted
    steps:
      # 只 checkout 已信任的 base commit；PR 的 scripts/workflow 永不执行。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read PR data blobs using base scripts
        id: prepare
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$PR_HEAD_SHA"
          node scripts/prepare-pr.mjs
      - name: Install base dependencies and PDF tools
        if: steps.prepare.outputs.data_only == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3
      - name: Cache Chromium
        if: steps.prepare.outputs.data_only == 'true'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0
      - name: Install browser system dependencies
        if: steps.prepare.outputs.data_only == 'true'
        run: npx --no-install playwright install-deps chromium
      - name: Install Chromium
        if: steps.prepare.outputs.data_only == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install chromium
      - name: Verify changed questions
        if: steps.prepare.outputs.data_only == 'true'
        id: verify
        env:
          # 外部作者没有 key；secret 不放在 job/global env，也不交给 PR 的代码。
          ANTHROPIC_API_KEY: ${{ steps.prepare.outputs.trusted == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          TRUSTED_AUTHOR: ${{ steps.prepare.outputs.trusted }}
        run: |
          args=()
          if [[ "$TRUSTED_AUTHOR" != "true" ]]; then args+=(--literal-only); fi
          node scripts/verify --base-dir data --data-dir ../candidate --report ../verify-report.md "${args[@]}"
      - name: Update one PR comment
        if: always() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/comment-pr.mjs
      - name: Keep full report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.md
          if-no-files-found: ignore
  merge:
    needs: verify
    permissions:
      contents: write
      pull-requests: write
    if: needs.verify.result == 'success' && needs.verify.outputs.data_only == 'true' && needs.verify.outputs.trusted == 'true' && needs.verify.outputs.verified == 'success' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 核对可并行，但自动合并必须串行；每次临合并再核 main/base/head。
    concurrency:
      group: melb-merge-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge only the verified main and PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: trusted
        run: node scripts/merge-pr.mjs
