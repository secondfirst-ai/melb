name: Verify dataset PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: melb-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trusted
    steps:
      # 只 checkout 已信任的 base commit；PR 的 scripts/workflow 永不执行。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read PR data blobs using base scripts
        id: prepare
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
          node scripts/prepare-pr.mjs
      - name: Install base dependencies and PDF tools
        if: steps.prepare.outputs.data_only == 'true'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3
      - name: Cache Chromium
        if: steps.prepare.outputs.data_only == 'true'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0
      - name: Install browser system dependencies
        if: steps.prepare.outputs.data_only == 'true'
        run: npx --no-install playwright install-deps chromium
      - name: Install Chromium
        if: steps.prepare.outputs.data_only == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install chromium
      - name: Verify changed questions
        if: steps.prepare.outputs.data_only == 'true'
        id: verify
        env:
          # 外部作者没有 key；secret 不放在 job/global env，也不交给 PR 的代码。
          ANTHROPIC_API_KEY: ${{ steps.prepare.outputs.trusted == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          TRUSTED_AUTHOR: ${{ steps.prepare.outputs.trusted }}
        run: |
          args=()
          if [[ "$TRUSTED_AUTHOR" != "true" ]]; then args+=(--literal-only); fi
          node scripts/verify --base-dir data --data-dir ../candidate --report ../verify-report.md "${args[@]}"
      - name: Update one PR comment
        if: always() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/comment-pr.mjs
      - name: Keep full report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.md
          if-no-files-found: ignore
      - name: Merge only a fully verified member PR at this exact head
        if: success() && steps.prepare.outputs.data_only == 'true' && steps.prepare.outputs.trusted == 'true' && steps.verify.outcome == 'success' && !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --squash --match-head-commit "$PR_HEAD_SHA"
